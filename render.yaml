services:
  - type: web
    name: trend-atlas
    runtime: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: gunicorn --chdir server -b 0.0.0.0:$PORT app:app
    envVars:
      - key: EXA_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SERVE_STATIC
        value: "1"
